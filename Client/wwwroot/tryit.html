                                           <!doctype html>
                                           <html lang="en">
                                           <head>
                                           <meta charset="utf-8" />
                                           <meta name="viewport" content="width=device-width, initial-scale=1" />
                                           <title>Sliding Tile Game (Config-only)</title>
                                           <style>
                                             :root{
                                               --size: min(90vmin, 640px);
                                               --gap: 6px;
                                               --round: 16px;
                                               --dur: .18s;
                                               --ease: cubic-bezier(.2,.8,.2,1);
                                               --accent: #6366f1;
                                               --bg: #0b0c10;
                                               --panel: #111317;
                                               --ink: #e5e7eb;
                                               --muted: #9ca3af;
                                             }
                                             * { box-sizing: border-box }
                                             html, body { height: 100%; margin: 0; background: radial-gradient(120% 120% at 80% -10%, #0f172a, #0b0c10 60%); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif; }
                                             .page { display:grid; gap: 16px; place-items:center; padding: 24px; }

                                             .title { font-size: clamp(20px, 3.5vw, 28px); font-weight: 800; letter-spacing:.2px; }
                                             .hud { display:flex; gap: 14px; align-items:center; justify-content:center; color: var(--muted); }
                                             .hud strong { color: var(--ink) }

                                             .board-wrap{ position:relative; }
                                             .board {
                                               position: relative; width: var(--size); height: var(--size);
                                               border-radius: var(--round); overflow: hidden; background: #0d1117;
                                               border: 1px solid rgba(255,255,255,.08);
                                               box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
                                             }
                                             .tile {
                                               position: absolute; top: 0; left: 0;
                                               width: calc((var(--size) - (var(--gap) * (var(--N) - 1))) / var(--N));
                                               height: calc((var(--size) - (var(--gap) * (var(--N) - 1))) / var(--N));
                                               border-radius: 10px;
                                               background-size: calc(var(--N) * 100%) calc(var(--N) * 100%); background-repeat: no-repeat;
                                               box-shadow: 0 8px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
                                               transition: transform var(--dur) var(--ease); will-change: transform;
                                               user-select: none; -webkit-user-drag: none; display:grid; place-items:end;
                                               font-weight:800; color: rgba(255,255,255,.9);
                                               text-shadow: 0 1px 0 rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.55);
                                               padding: 6px 8px; cursor: pointer;
                                             }
                                             .tile.is-empty { visibility:hidden; pointer-events:none; }
                                             .tile.kb-focus { outline: 3px solid var(--accent) }

                                             .toast {
                                               position: absolute; inset: auto 0 10px 0; margin-inline:auto;
                                               width:max-content; max-width: 90%;
                                               background: #111826; color:#e5e7eb; padding:10px 14px; border-radius:12px;
                                               opacity: 0; transform: translateY(8px);
                                               transition: all .25s var(--ease);
                                               border:1px solid rgba(255,255,255,.08);
                                             }
                                             .toast.show { opacity:1; transform: translateY(0); }
                                           </style>
                                           </head>
                                           <body>
                                             <div class="page">
                                               <div class="title">Sliding Tile Game</div>

                                               <div class="hud" role="status" aria-live="polite">
                                                 <div>Moves: <strong id="moves">0</strong></div>
                                                 <div>Time: <strong id="time">00:00</strong></div>
                                               </div>

                                               <div class="board-wrap">
                                                 <div id="board" class="board" aria-label="Sliding puzzle board"></div>
                                                 <div id="toast" class="toast" role="alert" aria-live="assertive">You win! 🎉</div>
                                               </div>
                                             </div>

                                           <script>
                                           /* =========================
                                              CONFIGURE HERE
                                              ========================= */
                                           window.PUZZLE_CONFIG = {
                                             N: 4,                                      // Grid size (2..10)
                                             image: "/images/yume_book_3d.webp",         // Image URL (same-origin or CORS-enabled)
                                             shuffleMovesPerTile: 240,                  // Shuffle intensity (multiplied by N)
                                             showNumbers: true                          // Show tile numbers overlay
                                           };
                                           /* ========================= */

                                           (() => {
                                             const boardEl  = document.getElementById('board');
                                             const movesEl  = document.getElementById('moves');
                                             const timeEl   = document.getElementById('time');
                                             const toastEl  = document.getElementById('toast');

                                             // Game state
                                             let N = clamp(int(PUZZLE_CONFIG.N, 4), 2, 10);
                                             let imgURL = PUZZLE_CONFIG.image || null;
                                             let tiles = [];           // permutation of [0..N*N-1]
                                             let emptyIndex = N*N - 1; // position of the empty slot
                                             let moves = 0;
                                             let timer = { start: 0, id: null, running: false };

                                             function int(v, d){ v = parseInt(v,10); return Number.isFinite(v) ? v : d; }
                                             function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
                                             function setNVars(){ boardEl.style.setProperty('--N', N); }

                                             // index <-> (row,col)
                                             const idxToRC = (idx) => [Math.floor(idx / N), idx % N];
                                             const rcToIdx = (r,c) => r * N + c;

                                             // Build solved array: [0..N*N-1]
                                             function makeSolved(){ return [...Array(N*N).keys()]; }

                                             function isSolved(){ for (let i=0;i<tiles.length;i++) if (tiles[i] !== i) return false; return true; }

                                             function formatTime(ms){
                                               const s = Math.floor(ms/1000), m = Math.floor(s/60);
                                               return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
                                             }

                                             function startTimer(){
                                               stopTimer();
                                               timer.start = performance.now(); timer.running = true;
                                               const tick = () => {
                                                 if (!timer.running) return;
                                                 timeEl.textContent = formatTime(performance.now() - timer.start);
                                                 timer.id = requestAnimationFrame(tick);
                                               };
                                               tick();
                                             }
                                             function stopTimer(){ if (timer.id) cancelAnimationFrame(timer.id); timer.running = false; }

                                             function showToast(msg="You win! 🎉"){
                                               toastEl.textContent = msg;
                                               toastEl.classList.add('show');
                                               setTimeout(()=>toastEl.classList.remove('show'), 2000);
                                             }

                                             // DOM
                                             function buildBoard(){
                                               boardEl.innerHTML = '';
                                               setNVars();

                                               const frag = document.createDocumentFragment();
                                               for (let i=0;i<N*N;i++){
                                                 const tileEl = document.createElement('div');
                                                 tileEl.className = 'tile';
                                                 tileEl.dataset.i = i;     // piece id (home position)
                                                 tileEl.tabIndex = 0;

                                                 // background slice for this piece
                                                 const r = Math.floor(i / N), c = i % N;
                                                 const bgX = (c / (N-1)) * 100, bgY = (r / (N-1)) * 100;
                                                 tileEl.style.backgroundPosition = `${bgX}% ${bgY}%`;

                                                 frag.appendChild(tileEl);
                                               }
                                               boardEl.appendChild(frag);

                                               applyBackgroundImage();
                                               render(); // solved layout initially
                                             }

                                             function applyBackgroundImage(){
                                               const tEls = boardEl.querySelectorAll('.tile');
                                               for (const el of tEls){
                                                 el.style.backgroundImage = imgURL ? `url("${imgURL}")` : defaultBackdrop();
                                               }
                                             }

                                             function defaultBackdrop(){
                                               const svg = encodeURIComponent(
                                                 `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
                                                    <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
                                                      <stop offset='0' stop-color='#1f2937'/><stop offset='1' stop-color='#0ea5e9'/></linearGradient></defs>
                                                    <rect width='100' height='100' fill='url(#g)'/>
                                                    <circle cx='75' cy='28' r='10' fill='rgba(255,255,255,0.18)'/>
                                                    <circle cx='35' cy='70' r='14' fill='rgba(255,255,255,0.12)'/>
                                                  </svg>`
                                               );
                                               return `url("data:image/svg+xml,${svg}")`;
                                             }

                                             function render(){
                                               const tEls = boardEl.querySelectorAll('.tile');
                                               const gap = parseFloat(getComputedStyle(boardEl).getPropertyValue('--gap'));
                                               const tileSize = (boardEl.clientWidth - (gap * (N-1))) / N;

                                               for (let pos=0; pos<tiles.length; pos++){
                                                 const pieceId = tiles[pos];
                                                 const el = tEls[pieceId];
                                                 const [r,c] = idxToRC(pos);
                                                 const x = c * (tileSize + gap);
                                                 const y = r * (tileSize + gap);
                                                 el.style.transform = `translate(${x}px, ${y}px)`;

                                                 if (pieceId === N*N-1){ // empty piece
                                                   el.classList.add('is-empty');
                                                   el.setAttribute('aria-hidden','true');
                                                   el.textContent = '';
                                                 } else {
                                                   el.classList.remove('is-empty');
                                                   el.removeAttribute('aria-hidden');
                                                   el.textContent = PUZZLE_CONFIG.showNumbers ? (pieceId + 1) : '';
                                                 }
                                                 el.classList.remove('kb-focus');
                                               }
                                             }

                                             function neighborsOf(idx){
                                               const [r,c] = idxToRC(idx); const list=[];
                                               if (r>0) list.push(rcToIdx(r-1,c));
                                               if (r<N-1) list.push(rcToIdx(r+1,c));
                                               if (c>0) list.push(rcToIdx(r,c-1));
                                               if (c<N-1) list.push(rcToIdx(r,c+1));
                                               return list;
                                             }

                                             function tryMove(tileIndex){
                                               if (tileIndex === emptyIndex) return false;
                                               if (!neighborsOf(emptyIndex).includes(tileIndex)) return false;

                                               const tmp = tiles[tileIndex];
                                               tiles[tileIndex] = tiles[emptyIndex];
                                               tiles[emptyIndex] = tmp;
                                               emptyIndex = tileIndex;

                                               moves++; movesEl.textContent = moves;
                                               render();

                                               if (isSolved()){
                                                 stopTimer();
                                                 showToast(`Solved in ${moves} moves, ${timeEl.textContent} ⏱️`);
                                               }
                                               return true;
                                             }

                                             function shuffleBoard(steps = 200 * N){
                                               let prev = -1;
                                               for (let k=0;k<steps;k++){
                                                 const opts = neighborsOf(emptyIndex).filter(i => i !== prev);
                                                 const pick = opts[Math.floor(Math.random()*opts.length)];
                                                 // swap without counting a move
                                                 const tmp = tiles[pick]; tiles[pick] = tiles[emptyIndex]; tiles[emptyIndex] = tmp;
                                                 prev = emptyIndex; emptyIndex = pick;
                                               }
                                               render();
                                               moves = 0; movesEl.textContent = '0';
                                               stopTimer(); startTimer();
                                             }

                                             // Click/touch
                                             boardEl.addEventListener('click', (e) => {
                                               const tileEl = e.target.closest('.tile'); if (!tileEl) return;
                                               const pieceId = parseInt(tileEl.dataset.i,10);
                                               const pos = tiles.indexOf(pieceId);
                                               if (tryMove(pos) && !timer.running) startTimer();
                                             });

                                             // Arrow keys move the neighbor into the empty
                                             document.addEventListener('keydown', (e) => {
                                               const key = e.key;
                                               let targetIndex = -1;
                                               const [er,ec] = idxToRC(emptyIndex);
                                               if (key === 'ArrowUp'   && er < N-1) targetIndex = rcToIdx(er+1, ec);
                                               if (key === 'ArrowDown' && er > 0)   targetIndex = rcToIdx(er-1, ec);
                                               if (key === 'ArrowLeft' && ec < N-1) targetIndex = rcToIdx(er, ec+1);
                                               if (key === 'ArrowRight'&& ec > 0)   targetIndex = rcToIdx(er, ec-1);

                                               if (targetIndex >= 0){
                                                 e.preventDefault();
                                                 tryMove(targetIndex);
                                                 if (!timer.running) startTimer();
                                                 const movedPieceId = tiles[targetIndex];
                                                 const el = boardEl.querySelector(`.tile[data-i="${movedPieceId}"]`);
                                                 if (el){ el.classList.add('kb-focus'); el.focus({preventScroll:true}); setTimeout(()=>el.classList.remove('kb-focus'), 180); }
                                               }
                                             }, {passive:false});

                                             // Init: build, then auto-shuffle
                                             (function init(){
                                               tiles = makeSolved();
                                               emptyIndex = tiles.length - 1;
                                               buildBoard();
                                               // Defer shuffle until first layout to avoid jank
                                               requestAnimationFrame(() => {
                                                 const steps = int(PUZZLE_CONFIG.shuffleMovesPerTile, 240) * N;
                                                 shuffleBoard(steps);
                                               });
                                             })();

                                             // Keep transforms crisp on resize
                                             window.addEventListener('resize', render);

                                           })();
                                           </script>
                                           </body>
                                           </html>
